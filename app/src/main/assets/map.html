<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html, #map {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background-color: #050508;
        }
        /* Custom styles to match the dark motorcycle instrument-cluster theme */
        .leaflet-container {
            background: #050508 !important;
        }
        /* Style the attribution elegantly */
        .leaflet-control-attribution {
            background: rgba(14, 14, 18, 0.8) !important;
            color: #64748B !important;
            font-size: 8px !important;
        }
        .leaflet-control-attribution a {
            color: #94A3B8 !important;
        }
        /* Custom markers for manual drawing */
        .draw-marker {
            background-color: #FB923C;
            border: 2px solid #ffffff;
            border-radius: 50%;
            width: 12px;
            height: 12px;
            box-shadow: 0 0 10px rgba(251, 146, 60, 0.9);
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
    <div id="map"></div>

    <script>
        var map;
        var activeTileLayer;
        var savedPolylines = {}; // Map of routeId -> Polyline
        var currentRidePolyline = null;
        var drawingPolyline = null;
        var drawingMarkers = [];
        var drawingMode = false;

        // Default coordinate: fallback if GPS is not set yet (e.g., London or Munich)
        var defaultLat = 51.505;
        var defaultLng = -0.09;

        // Initialize Map
        map = L.map('map', {
            zoomControl: false,
            attributionControl: true
        }).setView([defaultLat, defaultLng], 13);

        // Map theme function
        function setMapTheme(theme) {
            if (activeTileLayer) {
                map.removeLayer(activeTileLayer);
            }
            var themeName = 'dark';
            if (theme === true || theme === 'true' || theme === 'light') {
                themeName = 'light';
            } else if (theme === 'terrain') {
                themeName = 'terrain';
            }

            var url;
            if (themeName === 'light') {
                url = 'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png';
            } else if (themeName === 'terrain') {
                url = 'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png';
            } else {
                url = 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png';
            }
            
            var maxZoomVal = themeName === 'terrain' ? 17 : 20;
            activeTileLayer = L.tileLayer(url, {
                maxZoom: maxZoomVal,
                attribution: themeName === 'terrain' 
                    ? 'Map data: &copy; OSM, SRTM | Style: OpenTopoMap' 
                    : '&copy; OpenStreetMap &copy; CARTO'
            }).addTo(map);

            // Update container background colors dynamically to match
            var body = document.body;
            var container = document.querySelector('.leaflet-container');
            if (themeName === 'light') {
                body.style.backgroundColor = '#F8FAFC';
                if (container) container.style.setProperty('background', '#F8FAFC', 'important');
            } else if (themeName === 'terrain') {
                body.style.backgroundColor = '#E1E9DD';
                if (container) container.style.setProperty('background', '#E1E9DD', 'important');
            } else {
                body.style.backgroundColor = '#050508';
                if (container) container.style.setProperty('background', '#050508', 'important');
            }
        }

        // Initialize tile layer placeholder
        activeTileLayer = null;
        setMapTheme(false); // Default to Dark, will be set programmatically instantly via JS interface if needed

        // Map Click Event for Drawing Mode
        map.on('click', function(e) {
            if (drawingMode) {
                var lat = e.latlng.lat;
                var lng = e.latlng.lng;
                if (window.AndroidInterface) {
                    window.AndroidInterface.onMapClick(lat, lng);
                }
            }
        });

        // Interface: Update User Current Location Marker
        var userLocationMarker = null;
        function updateUserLocation(lat, lng, heading) {
            var latlng = L.latLng(lat, lng);
            if (!userLocationMarker) {
                // Glow marker for dynamic cycle indicator
                var glowIcon = L.divIcon({
                    className: '',
                    html: '<div style="background-color: #22D3EE; border: 2px solid white; border-radius: 50%; width: 14px; height: 14px; box-shadow: 0 0 12px #22D3EE;"></div>',
                    iconSize: [14, 14],
                    iconAnchor: [7, 7]
                });
                userLocationMarker = L.marker(latlng, { icon: glowIcon }).addTo(map);
            } else {
                userLocationMarker.setLatLng(latlng);
            }
        }

        // Interface: Center map
        function centerMap(lat, lng, zoomLevel) {
            map.setView([lat, lng], zoomLevel || map.getZoom());
        }

        // Interface: Search Result Pin Marker
        var searchResultMarker = null;
        function updateSearchResultMarker(lat, lng, name) {
            if (searchResultMarker) {
                map.removeLayer(searchResultMarker);
                searchResultMarker = null;
            }
            if (lat === undefined || lat === null || lng === undefined || lng === null) return;
            
            var latlng = [lat, lng];
            var searchIcon = L.divIcon({
                className: '',
                html: '<div style="background-color: #EF4444; width: 14px; height: 14px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 10px rgba(239, 68, 68, 0.9);"></div>',
                iconSize: [14, 14],
                iconAnchor: [7, 7]
            });
            searchResultMarker = L.marker(latlng, { icon: searchIcon }).addTo(map);
            if (name) {
                searchResultMarker.bindPopup("<b>" + name + "</b>").openPopup();
            }
        }

        // Interface: Set Drawing Mode Status
        function setDrawingMode(active) {
            drawingMode = active;
            if (!active) {
                clearDrawing();
            }
        }

        // Interface: Clear Manual Drawing points from visual layer
        function clearDrawing() {
            if (drawingPolyline) {
                map.removeLayer(drawingPolyline);
                drawingPolyline = null;
            }
            drawingMarkers.forEach(function(marker) {
                map.removeLayer(marker);
            });
            drawingMarkers = [];
        }

        // Interface: Update current drawing path coordinates and waypoints
        function updateDrawing(pointsData, waypointsData) {
            clearDrawing();
            var points = typeof pointsData === 'string' ? JSON.parse(pointsData) : pointsData;
            var waypoints = typeof waypointsData === 'string' ? JSON.parse(waypointsData) : waypointsData;
            if (!points || points.length === 0) return;

            var latlngs = points.map(p => [p.lat, p.lng]);

            // Draw line
            drawingPolyline = L.polyline(latlngs, {
                color: '#FB923C',
                weight: 5,
                opacity: 0.9,
                dashArray: '5, 8',
                lineJoin: 'round'
            }).addTo(map);

            // Place markers for each active waypoint
            if (waypoints && waypoints.length > 0) {
                waypoints.forEach(function(p, index) {
                    var customIcon = L.divIcon({
                        className: 'draw-marker',
                        iconSize: [12, 12],
                        iconAnchor: [6, 6]
                    });
                    var marker = L.marker([p.lat, p.lng], { icon: customIcon }).addTo(map);
                    marker.on('click', function() {
                        if (window.AndroidInterface) {
                            window.AndroidInterface.onMarkerClick(index);
                        }
                    });
                    drawingMarkers.push(marker);
                });
            }

            // Adjust view to fit drawing points
            if (points.length === 1) {
                map.setView(latlngs[0], 15);
            } else {
                map.fitBounds(drawingPolyline.getBounds(), { padding: [40, 40] });
            }
        }

        // Interface: Draw/Update Saved Lifetime Routes
        function drawSavedRoutes(routesData) {
            // Remove previous saved polylines
            Object.keys(savedPolylines).forEach(function(key) {
                map.removeLayer(savedPolylines[key]);
            });
            savedPolylines = {};

            var routes = typeof routesData === 'string' ? JSON.parse(routesData) : routesData;
            if (!routes) return;
            routes.forEach(function(route) {
                var latlngs = route.coordinates.map(p => [p.lat, p.lng]);
                if (latlngs.length < 2) return;

                // Alternate or bright electric blue / orange accent coloring
                var routeColor = route.mode === 'gps' ? '#22D3EE' : '#F43F5E'; // electric cyan or neon pink

                var polyline = L.polyline(latlngs, {
                    color: routeColor,
                    weight: 6,
                    opacity: 0.85,
                    lineJoin: 'round',
                    lineCap: 'round'
                }).addTo(map);

                // Add nice tooltips with information
                var formattedDate = new Date(route.date).toLocaleDateString();
                var modeLabel = route.mode === 'gps' ? '🏍️ GPS Recorded' : '🗺️ Manual Draw';
                polyline.bindTooltip(
                    `<b>${route.name}</b><br/>${formattedDate} • ${route.distance.toFixed(2)} km<br/><i>${modeLabel}</i>`,
                    { sticky: true, className: 'route-tooltip' }
                );

                polyline.on('click', function() {
                    if (window.AndroidInterface) {
                        window.AndroidInterface.onRouteSelect(route.id);
                    }
                });

                savedPolylines[route.id] = polyline;
            });
        }

        // Interface: Update Live Active Ride Path
        function updateCurrentRide(pointsData) {
            if (currentRidePolyline) {
                map.removeLayer(currentRidePolyline);
                currentRidePolyline = null;
            }

            var points = typeof pointsData === 'string' ? JSON.parse(pointsData) : pointsData;
            if (!points || points.length < 2) return;

            var latlngs = points.map(p => [p.lat, p.lng]);

            // Neon green / electric pulse style for active track
            currentRidePolyline = L.polyline(latlngs, {
                color: '#10B981', // active live emerald green
                weight: 8,
                opacity: 0.95,
                lineJoin: 'round',
                lineCap: 'round',
                shadowColor: '#10B981',
                shadowBlur: 10
            }).addTo(map);

            // Automatically pan to keep the rider centered
            var lastPoint = latlngs[latlngs.length - 1];
            map.setView(lastPoint, map.getZoom());
        }

        // Interface: Fit Bounds to Selected Route
        function focusRoute(pointsData) {
            var points = typeof pointsData === 'string' ? JSON.parse(pointsData) : pointsData;
            if (!points || points.length === 0) return;
            var latlngs = points.map(p => [p.lat, p.lng]);
            if (latlngs.length === 1) {
                map.setView(latlngs[0], 16);
            } else {
                var bounds = L.latLngBounds(latlngs);
                map.fitBounds(bounds, { padding: [50, 50] });
            }
        }
    </script>
</body>
</html>
