name: Build Debug APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout the repo
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Set up JDK 17 (required for modern Android/Gradle)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Set up Android SDK
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # 4. Decode the debug keystore from the base64 file in the repo
      - name: Decode debug keystore
        run: |
          base64 -d debug.keystore.base64 > debug.keystore

      # 5. Create the .env file with the Gemini API key from GitHub Secrets
      - name: Create .env file
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > .env

      # 6. Grant execute permission for Gradle wrapper
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # 7. Cache Gradle dependencies for faster builds
      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      # 8. Build the debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 9. Find and upload the APK artifact
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: riders-track-map-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
